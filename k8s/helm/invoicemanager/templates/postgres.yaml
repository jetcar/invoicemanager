{{- if .Values.infrastructure.postgres.enabled }}
{{- range .Values.infrastructure.postgres.databases }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-{{ .name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "invoicemanager.labels" $ | nindent 4 }}
    app.kubernetes.io/name: postgres-{{ .name }}
spec:
  serviceName: postgres-{{ .name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-{{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-{{ .name }}
        app.kubernetes.io/part-of: invoicemanager
    spec:
      containers:
        - name: postgres
          image: {{ $.Values.infrastructure.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .db | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: invoicemanager-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoicemanager-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml $.Values.infrastructure.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", {{ .db | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", {{ .db | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $.Values.infrastructure.postgres.storagePerDb }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-{{ .name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "invoicemanager.labels" $ | nindent 4 }}
    app.kubernetes.io/name: postgres-{{ .name }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres-{{ .name }}
  ports:
    - port: 5432
      name: postgres
{{- end }}
{{- end }}
