{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invoicemanager
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "invoicemanager.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8000
          - path: /api/v1/companies
            pathType: Prefix
            backend:
              service:
                name: company-service
                port:
                  number: 8000
          - path: /api/v1/organizations
            pathType: Prefix
            backend:
              service:
                name: company-service
                port:
                  number: 8000
          - path: /api/v1/invoices
            pathType: Prefix
            backend:
              service:
                name: invoice-service
                port:
                  number: 8000
          - path: /api/v1/suppliers
            pathType: Prefix
            backend:
              service:
                name: supplier-service
                port:
                  number: 8000
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8000
          - path: /api/v1/audit
            pathType: Prefix
            backend:
              service:
                name: audit-service
                port:
                  number: 8000
          - path: /api/v1/archive
            pathType: Prefix
            backend:
              service:
                name: archive-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8000
{{- end }}
