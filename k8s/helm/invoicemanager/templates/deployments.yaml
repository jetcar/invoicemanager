{{- range $key, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "invoicemanager.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svc.name }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svc.name }}
      app.kubernetes.io/part-of: invoicemanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $svc.name }}
        app.kubernetes.io/part-of: invoicemanager
      annotations:
        # Force pod restart when the config or secret changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ $.Values.global.serviceAccountName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $svc.name }}
          image: {{ $.Values.global.imageRegistry }}/{{ $svc.image }}:{{ $.Values.global.imageTag }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: invoicemanager-config
            - secretRef:
                name: invoicemanager-secrets
          env:
            {{- range $envKey, $envVal := $svc.env }}
            - name: {{ $envKey }}
              {{- if $envVal.configKey }}
              valueFrom:
                configMapKeyRef:
                  name: invoicemanager-config
                  key: {{ $envKey }}
              {{- else if $envVal.value }}
              value: {{ $envVal.value | quote }}
              {{- end }}
            {{- end }}
            # Shared across all services
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: invoicemanager-secrets
                  key: SECRET_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ $svc.name }}
                topologyKey: kubernetes.io/hostname
{{- end }}
