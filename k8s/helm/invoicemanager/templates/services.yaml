{{- range $key, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "invoicemanager.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svc.name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: invoicemanager
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
{{- end }}
