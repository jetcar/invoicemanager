{{- if .Values.externalSecrets.enabled }}
---
# GCP Secret Manager SecretStore — uses Workload Identity (no static credentials)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "invoicemanager.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.global.gcpProjectId }}
      # Auth via Workload Identity — the pod's KSA maps to the GCP App SA
      auth:
        workloadIdentity:
          clusterLocation: {{ default "europe-west1" .Values.global.region }}
          clusterName: {{ default "invoicemanager-dev" .Values.global.clusterName }}
          serviceAccountRef:
            name: {{ .Values.global.serviceAccountName }}

---
# ExternalSecret — pulls all InvoiceManager secrets from Secret Manager
# and materialises them as a Kubernetes Secret used by all pods
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: invoicemanager-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "invoicemanager.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: invoicemanager-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.global.secretPrefix }}-postgres-password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.global.secretPrefix }}-redis-password
    - secretKey: SECRET_KEY
      remoteRef:
        key: {{ .Values.global.secretPrefix }}-secret-key
    - secretKey: SMTP_USER
      remoteRef:
        key: {{ .Values.global.secretPrefix }}-smtp-user
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: {{ .Values.global.secretPrefix }}-smtp-password
    - secretKey: FIREBASE_CREDENTIALS_JSON
      remoteRef:
        key: {{ .Values.global.secretPrefix }}-firebase-credentials-json
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ .Values.global.secretPrefix }}-postgres-user
{{- end }}
