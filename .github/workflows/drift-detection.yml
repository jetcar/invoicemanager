name: Drift Detection

on:
  # Run every day at 06:00 UTC
  schedule:
    - cron: "0 6 * * *"

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write   # to open a drift issue if detected

env:
  TF_VERSION: "1.9.8"

jobs:
  drift-dev:
    name: Detect drift (dev)
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/terraform/environments/dev

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SA_EMAIL_DEV }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (drift check)
        id: plan
        run: |
          terraform plan -detailed-exitcode -no-color 2>&1 | tee plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID_DEV }}
        continue-on-error: true

      - name: Open GitHub issue on drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/environments/dev/plan-output.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Terraform drift detected in dev',
              body: `## Terraform drift detected\n\nA scheduled drift check found that the **dev** GCP infrastructure no longer matches the Terraform state.\n\nPlease review and apply the plan.\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\`\n</details>`,
              labels: ['infrastructure', 'drift'],
            });

  drift-staging:
    name: Detect drift (staging)
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: infra/terraform/environments/staging

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_STAGING }}
          service_account: ${{ secrets.GCP_SA_EMAIL_STAGING }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (drift check)
        id: plan
        run: |
          terraform plan -detailed-exitcode -no-color 2>&1 | tee plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID_STAGING }}
        continue-on-error: true

      - name: Open GitHub issue on drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/environments/staging/plan-output.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Terraform drift detected in staging',
              body: `## Terraform drift detected\n\nA scheduled drift check found that the **staging** GCP infrastructure no longer matches the Terraform state.\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\`\n</details>`,
              labels: ['infrastructure', 'drift'],
            });

  drift-prod:
    name: Detect drift (production)
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform/environments/prod

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SA_EMAIL_PROD }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (drift check)
        id: plan
        run: |
          terraform plan -detailed-exitcode -no-color 2>&1 | tee plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID_PROD }}
        continue-on-error: true

      - name: Open GitHub issue on drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/environments/prod/plan-output.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Terraform drift detected in PRODUCTION',
              body: `## PRODUCTION drift detected\n\nA scheduled drift check found that **production** GCP infrastructure no longer matches the Terraform state. **Immediate review required.**\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\`\n</details>`,
              labels: ['infrastructure', 'drift', 'urgent'],
            });
