name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "k8s/**"
      - ".github/workflows/build-deploy.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: "Image tag to deploy (leave empty to build from HEAD)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: "3.16.0"
  GCP_REGION: europe-west1

jobs:
  # ────────────────────────────────────────────────────────────────[...]
  # Build: compile image tag, build all 7 service images and push to GAR
  # ────────────────────────────────────────────────────────────────[...]
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SA_EMAIL_DEV }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push — auth-service
        uses: docker/build-push-action@v6
        with:
          context: services/auth-service
          push: true
          tags: |
            ${{ secrets.GCP_REGISTRY_DEV }}/auth-service:${{ steps.meta.outputs.tag }}
            ${{ secrets.GCP_REGISTRY_DEV }}/auth-service:latest
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,scope=auth-service,mode=max

      - name: Build and push — company-service
        uses: docker/build-push-action@v6
        with:
          context: services/company-service
          push: true
          tags: |
            ${{ secrets.GCP_REGISTRY_DEV }}/company-service:${{ steps.meta.outputs.tag }}
            ${{ secrets.GCP_REGISTRY_DEV }}/company-service:latest
          cache-from: type=gha,scope=company-service
          cache-to: type=gha,scope=company-service,mode=max

      - name: Build and push — invoice-service
        uses: docker/build-push-action@v6
        with:
          context: services/invoice-service
          push: true
          tags: |
            ${{ secrets.GCP_REGISTRY_DEV }}/invoice-service:${{ steps.meta.outputs.tag }}
            ${{ secrets.GCP_REGISTRY_DEV }}/invoice-service:latest
          cache-from: type=gha,scope=invoice-service
          cache-to: type=gha,scope=invoice-service,mode=max

      - name: Build and push — supplier-service
        uses: docker/build-push-action@v6
        with:
          context: services/supplier-service
          push: true
          tags: |
            ${{ secrets.GCP_REGISTRY_DEV }}/supplier-service:${{ steps.meta.outputs.tag }}
            ${{ secrets.GCP_REGISTRY_DEV }}/supplier-service:latest
          cache-from: type=gha,scope=supplier-service
          cache-to: type=gha,scope=supplier-service,mode=max

      - name: Build and push — notification-service
        uses: docker/build-push-action@v6
        with:
          context: services/notification-service
          push: true
          tags: |
            ${{ secrets.GCP_REGISTRY_DEV }}/notification-service:${{ steps.meta.outputs.tag }}
            ${{ secrets.GCP_REGISTRY_DEV }}/notification-service:latest
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,scope=notification-service,mode=max

      - name: Build and push — audit-service
        uses: docker/build-push-action@v6
        with:
          context: services/audit-service
          push: true
          tags: |
            ${{ secrets.GCP_REGISTRY_DEV }}/audit-service:${{ steps.meta.outputs.tag }}
            ${{ secrets.GCP_REGISTRY_DEV }}/audit-service:latest
          cache-from: type=gha,scope=audit-service
          cache-to: type=gha,scope=audit-service,mode=max

      - name: Build and push — archive-service
        uses: docker/build-push-action@v6
        with:
          context: services/archive-service
          push: true
          tags: |
            ${{ secrets.GCP_REGISTRY_DEV }}/archive-service:${{ steps.meta.outputs.tag }}
            ${{ secrets.GCP_REGISTRY_DEV }}/archive-service:latest
          cache-from: type=gha,scope=archive-service
          cache-to: type=gha,scope=archive-service,mode=max

  # ────────────────────────────────────────────────────────────────[...]
  # Deploy to dev
  # ────────────────────────────────────────────────────────────────[...]
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    needs: build
    if: github.event_name == 'push' || inputs.environment == 'dev'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SA_EMAIL_DEV }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: invoicemanager-dev
          location: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID_DEV }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Unlock stuck Helm releases
        run: |
          for RELEASE_NS in "external-secrets:external-secrets" "invoicemanager:invoicemanager"; do
            RELEASE="${RELEASE_NS%%:*}"
            NS="${RELEASE_NS##*:}"
            STATUS=$(helm status "$RELEASE" -n "$NS" -o json 2>/dev/null | jq -r '.info.status' || echo "not-installed")
            if [[ "$STATUS" =~ ^(pending-install|pending-upgrade|pending-rollback)$ ]]; then
              echo "Release '$RELEASE' in namespace '$NS' is stuck in '$STATUS'; recovering..."
              helm rollback "$RELEASE" -n "$NS" --wait --timeout=5m 2>/dev/null || \
                helm uninstall "$RELEASE" -n "$NS" || true
            fi
          done

      - name: Install / upgrade External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io --force-update
          helm repo update

          # Recover from a stuck pending release left by a previously cancelled/failed run
          status=$(helm status external-secrets -n external-secrets -o json 2>/dev/null | jq -r '.info.status // empty')
          if [[ "$status" =~ ^pending- ]]; then
            echo "Release is stuck in '$status'; attempting rollback to unblock..."
            last_deployed=$(helm history external-secrets -n external-secrets -o json \
              | jq -r '[.[] | select(.status=="deployed")] | if length > 0 then max_by(.revision).revision | tostring else "null" end')
            if [[ -n "$last_deployed" && "$last_deployed" != "null" ]]; then
              helm rollback external-secrets "$last_deployed" -n external-secrets --wait --timeout 5m || true
            else
              echo "No previously deployed revision found; removing stuck release..."
              helm delete external-secrets -n external-secrets --no-hooks || true
            fi
          fi

          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --set installCRDs=true \
            --wait \
            --timeout=10m

      - name: Wait for External Secrets CRDs
        run: |
          kubectl wait --for=condition=Established --timeout=180s \
            crd/externalsecrets.external-secrets.io \
            crd/secretstores.external-secrets.io \
            crd/clustersecretstores.external-secrets.io
          # Poll until the API server's discovery endpoint exposes the new groups
          # (kubectl wait confirms the CRD object exists, but Helm's API discovery
          # can lag until the API server registers the new group)
          for kind in ExternalSecret SecretStore; do
            echo "Waiting for $kind to appear in API discovery..."
            until kubectl api-resources --api-group=external-secrets.io 2>/dev/null | grep -q "^${kind}"; do
              echo "  $kind not yet discoverable, retrying in 5s..."
              sleep 5
            done
            echo "  $kind is discoverable"
          done

      - name: Helm upgrade / install
        run: |
          APP_SA_EMAIL="${{ secrets.GCP_APP_SA_EMAIL_DEV }}"
          if [[ -z "$APP_SA_EMAIL" ]]; then
            APP_SA_EMAIL="invoicemanager-app-dev@${{ secrets.GCP_PROJECT_ID_DEV }}.iam.gserviceaccount.com"
          fi

          helm upgrade --install invoicemanager k8s/helm/invoicemanager \
            --namespace invoicemanager \
            --create-namespace \
            --set global.imageTag="${{ needs.build.outputs.image_tag }}" \
            --set global.imageRegistry="${{ secrets.GCP_REGISTRY_DEV }}" \
            --set global.gcpProjectId="${{ secrets.GCP_PROJECT_ID_DEV }}" \
            --set global.gcpAppSaEmail="${APP_SA_EMAIL}" \
            --set global.secretPrefix="invoicemanager-dev" \
            --wait \
            --timeout=10m \
            --atomic

  # ────────────────────────────────────────────────────────────────[...]
  # Deploy to staging (requires manual approval in GitHub Environments)
  # ────────────────────────────────────────────────────────────────[...]
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    needs: [build, deploy-dev]
    if: github.event_name == 'push' || inputs.environment == 'staging'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_STAGING }}
          service_account: ${{ secrets.GCP_SA_EMAIL_STAGING }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: invoicemanager-staging
          location: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID_STAGING }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Unlock stuck Helm releases
        run: |
          for RELEASE_NS in "external-secrets:external-secrets" "invoicemanager:invoicemanager"; do
            RELEASE="${RELEASE_NS%%:*}"
            NS="${RELEASE_NS##*:}"
            STATUS=$(helm status "$RELEASE" -n "$NS" -o json 2>/dev/null | jq -r '.info.status' || echo "not-installed")
            if [[ "$STATUS" =~ ^(pending-install|pending-upgrade|pending-rollback)$ ]]; then
              echo "Release '$RELEASE' in namespace '$NS' is stuck in '$STATUS'; recovering..."
              helm rollback "$RELEASE" -n "$NS" --wait --timeout=5m 2>/dev/null || \
                helm uninstall "$RELEASE" -n "$NS" || true
            fi
          done

      - name: Install / upgrade External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io --force-update
          helm repo update

          # Recover from a stuck pending release left by a previously cancelled/failed run
          status=$(helm status external-secrets -n external-secrets -o json 2>/dev/null | jq -r '.info.status // empty')
          if [[ "$status" =~ ^pending- ]]; then
            echo "Release is stuck in '$status'; attempting rollback to unblock..."
            last_deployed=$(helm history external-secrets -n external-secrets -o json \
              | jq -r '[.[] | select(.status=="deployed")] | if length > 0 then max_by(.revision).revision | tostring else "null" end')
            if [[ -n "$last_deployed" && "$last_deployed" != "null" ]]; then
              helm rollback external-secrets "$last_deployed" -n external-secrets --wait --timeout 5m || true
            else
              echo "No previously deployed revision found; removing stuck release..."
              helm delete external-secrets -n external-secrets --no-hooks || true
            fi
          fi

          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --set installCRDs=true \
            --wait \
            --timeout=10m

      - name: Wait for External Secrets CRDs
        run: |
          kubectl wait --for=condition=Established --timeout=180s \
            crd/externalsecrets.external-secrets.io \
            crd/secretstores.external-secrets.io \
            crd/clustersecretstores.external-secrets.io
          # Poll until the API server's discovery endpoint exposes the new groups
          for kind in ExternalSecret SecretStore; do
            echo "Waiting for $kind to appear in API discovery..."
            until kubectl api-resources --api-group=external-secrets.io 2>/dev/null | grep -q "^${kind}"; do
              echo "  $kind not yet discoverable, retrying in 5s..."
              sleep 5
            done
            echo "  $kind is discoverable"
          done

      - name: Helm upgrade / install
        run: |
          APP_SA_EMAIL="${{ secrets.GCP_APP_SA_EMAIL_STAGING }}"
          if [[ -z "$APP_SA_EMAIL" ]]; then
            APP_SA_EMAIL="invoicemanager-app-staging@${{ secrets.GCP_PROJECT_ID_STAGING }}.iam.gserviceaccount.com"
          fi

          helm upgrade --install invoicemanager k8s/helm/invoicemanager \
            --namespace invoicemanager \
            --create-namespace \
            --values k8s/helm/invoicemanager/values-staging.yaml \
            --set global.imageTag="${{ needs.build.outputs.image_tag }}" \
            --set global.imageRegistry="${{ secrets.GCP_REGISTRY_STAGING }}" \
            --set global.gcpProjectId="${{ secrets.GCP_PROJECT_ID_STAGING }}" \
            --set global.gcpAppSaEmail="${APP_SA_EMAIL}" \
            --set global.secretPrefix="invoicemanager-staging" \
            --wait \
            --timeout=10m \
            --atomic

  # ────────────────────────────────────────────────────────────────[...]
  # Deploy to production (requires required reviewers in GitHub Environments)
  # ────────────────────────────────────────────────────────────────[...]
  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    needs: [build, deploy-staging]
    if: github.event_name == 'push' || inputs.environment == 'prod'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SA_EMAIL_PROD }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: invoicemanager-prod
          location: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID_PROD }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Unlock stuck Helm releases
        run: |
          for RELEASE_NS in "external-secrets:external-secrets" "invoicemanager:invoicemanager"; do
            RELEASE="${RELEASE_NS%%:*}"
            NS="${RELEASE_NS##*:}"
            STATUS=$(helm status "$RELEASE" -n "$NS" -o json 2>/dev/null | jq -r '.info.status' || echo "not-installed")
            if [[ "$STATUS" =~ ^(pending-install|pending-upgrade|pending-rollback)$ ]]; then
              echo "Release '$RELEASE' in namespace '$NS' is stuck in '$STATUS'; recovering..."
              helm rollback "$RELEASE" -n "$NS" --wait --timeout=5m 2>/dev/null || \
                helm uninstall "$RELEASE" -n "$NS" || true
            fi
          done

      - name: Install / upgrade External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io --force-update
          helm repo update

          # Recover from a stuck pending release left by a previously cancelled/failed run
          status=$(helm status external-secrets -n external-secrets -o json 2>/dev/null | jq -r '.info.status // empty')
          if [[ "$status" =~ ^pending- ]]; then
            echo "Release is stuck in '$status'; attempting rollback to unblock..."
            last_deployed=$(helm history external-secrets -n external-secrets -o json \
              | jq -r '[.[] | select(.status=="deployed")] | if length > 0 then max_by(.revision).revision | tostring else "null" end')
            if [[ -n "$last_deployed" && "$last_deployed" != "null" ]]; then
              helm rollback external-secrets "$last_deployed" -n external-secrets --wait --timeout 5m || true
            else
              echo "No previously deployed revision found; removing stuck release..."
              helm delete external-secrets -n external-secrets --no-hooks || true
            fi
          fi

          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --set installCRDs=true \
            --wait \
            --timeout=10m

      - name: Wait for External Secrets CRDs
        run: |
          kubectl wait --for=condition=Established --timeout=180s \
            crd/externalsecrets.external-secrets.io \
            crd/secretstores.external-secrets.io \
            crd/clustersecretstores.external-secrets.io
          # Poll until the API server's discovery endpoint exposes the new groups
          for kind in ExternalSecret SecretStore; do
            echo "Waiting for $kind to appear in API discovery..."
            until kubectl api-resources --api-group=external-secrets.io 2>/dev/null | grep -q "^${kind}"; do
              echo "  $kind not yet discoverable, retrying in 5s..."
              sleep 5
            done
            echo "  $kind is discoverable"
          done

      - name: Helm upgrade / install
        run: |
          APP_SA_EMAIL="${{ secrets.GCP_APP_SA_EMAIL_PROD }}"
          if [[ -z "$APP_SA_EMAIL" ]]; then
            APP_SA_EMAIL="invoicemanager-app-prod@${{ secrets.GCP_PROJECT_ID_PROD }}.iam.gserviceaccount.com"
          fi

          helm upgrade --install invoicemanager k8s/helm/invoicemanager \
            --namespace invoicemanager \
            --create-namespace \
            --values k8s/helm/invoicemanager/values-prod.yaml \
            --set global.imageTag="${{ needs.build.outputs.image_tag }}" \
            --set global.imageRegistry="${{ secrets.GCP_REGISTRY_PROD }}" \
            --set global.gcpProjectId="${{ secrets.GCP_PROJECT_ID_PROD }}" \
            --set global.gcpAppSaEmail="${APP_SA_EMAIL}" \
            --set global.secretPrefix="invoicemanager-prod" \
            --wait \
            --timeout=15m \
            --atomic

      - name: Tag release in Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "release-$(date +%Y%m%d%H%M%S)-${{ needs.build.outputs.image_tag }}"
          git push origin --tags
