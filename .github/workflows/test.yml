name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-invoice-service:
    name: Invoice service unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/invoice-service/tests/requirements-test.txt

      - name: Install test dependencies
        run: |
          cd services/invoice-service
          pip install lxml pytest

      - name: Run tests
        run: |
          cd services/invoice-service
          python -m pytest tests/ -v
