name: Spec-First Invoice Service

on:
  pull_request:
    paths:
      - "services/invoice-service/**"
      - "specs/invoice-service/**"
      - "scripts/spec/**"
      - ".github/workflows/spec-first-invoice.yml"
  workflow_dispatch:

jobs:
  invoice-spec-first:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install invoice-service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/invoice-service/requirements.txt -r services/invoice-service/tests/requirements-test.txt

      - name: Regenerate spec-driven artifacts
        run: |
          python scripts/spec/generate_invoice_artifacts.py

      - name: Ensure generated artifacts are committed
        run: |
          if [ -n "$(git status --porcelain -- specs/invoice-service/v1/openapi.json services/invoice-service/generated services/invoice-service/tests/generated)" ]; then
            echo "Generated artifacts are out of date. Run: python scripts/spec/generate_invoice_artifacts.py"
            git status --porcelain -- specs/invoice-service/v1/openapi.json services/invoice-service/generated services/invoice-service/tests/generated
            exit 1
          fi

      - name: Run invoice-service tests (unit + generated contract)
        run: |
          cd services/invoice-service
          PYTHONPATH=. python -m pytest tests/ -v

      - name: Export base branch OpenAPI spec
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/base-openapi
          if git show origin/${{ github.base_ref }}:specs/invoice-service/v1/openapi.json > /tmp/base-openapi/openapi.json 2>/dev/null; then
            echo "Base spec exported"
          else
            echo "{}" > /tmp/base-openapi/openapi.json
            echo "No base spec found; treating as first introduction"
          fi

      - name: Check OpenAPI compatibility
        if: github.event_name == 'pull_request'
        id: compatibility
        continue-on-error: true
        run: |
          python scripts/spec/check_openapi_breaking.py \
            --base /tmp/base-openapi/openapi.json \
            --head specs/invoice-service/v1/openapi.json

      - name: Enforce compatibility unless override label exists
        if: github.event_name == 'pull_request' && steps.compatibility.outcome == 'failure' && !contains(github.event.pull_request.labels.*.name, 'allow-breaking-openapi')
        run: |
          echo "Breaking OpenAPI changes detected. Add the 'allow-breaking-openapi' label to override."
          exit 1

      - name: Log compatibility override
        if: github.event_name == 'pull_request' && steps.compatibility.outcome == 'failure' && contains(github.event.pull_request.labels.*.name, 'allow-breaking-openapi')
        run: |
          echo "Breaking changes allowed by allow-breaking-openapi label."
