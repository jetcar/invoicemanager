name: Update Architecture Diagram

on:
  schedule:
    # Run every day at 02:00 UTC
    - cron: "0 2 * * *"

  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "haproxy/haproxy.cfg"
      - "k8s/helm/invoicemanager/values.yaml"
      - "infra/terraform/environments/**"
      - ".github/workflows/build-deploy.yml"
      - "scripts/generate_architecture_diagram.py"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Regenerate Architecture Diagram
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a token with write access so the commit can push back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Generate architecture diagram
        run: python3 scripts/generate_architecture_diagram.py

      - name: Commit updated diagram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: auto-update architecture diagram [skip ci]"
            git push
          fi
